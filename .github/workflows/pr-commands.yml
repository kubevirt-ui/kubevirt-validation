# .github/workflows/pr-commands.yml
name: PR Commands

# Scoped dispatcher for /clone and /recheck-jira only (kubevirt-plugin pr-commands
# parity without E2E cancel/hold follow-up jobs). Bot filtering, command matching,
# trust, and routing run in src/commands/dispatcher.ts. Step stays green on handled failures.
#
# This workflow file must exist on the default branch for issue_comment to run.
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write
  statuses: write

jobs:
  dispatch:
    name: PR Command
    if: github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Default branch checkout (trusted OWNERS on disk). fetch-depth 0 for /clone git.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate bot token
        id: bot-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Dispatch command
        id: run
        env:
          BOT_TOKEN: ${{ steps.bot-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          STATUS_GITHUB_TOKEN: ${{ github.token }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_ID: ${{ github.event.comment.id }}
          PR_NUMBER: ${{ github.event.issue.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: npx tsx src/commands/dispatcher.ts