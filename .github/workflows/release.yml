name: Release action

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing immutable release tag (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  update-floating-tags:
    name: Update vMAJOR and latest tags
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease != true
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: meta
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected semver tag vMAJOR.MINOR.PATCH, got: $TAG_NAME"
            exit 1
          fi
          major_tag="${TAG_NAME%%.*}"
          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "major_tag=${major_tag}" >> "${GITHUB_OUTPUT}"

      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-actions: write
          permission-contents: write
          permission-workflows: write

      - name: Require bot token
        env:
          BOT_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "${BOT_TOKEN}" ]; then
            echo "::error::Failed to mint kubevirt-plugin-bot installation token. Check org secrets BOT_APP_ID and BOT_APP_PRIVATE_KEY and that the App is installed on this repository with Contents + Workflows write."
            exit 1
          fi

      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag_name }}
          fetch-depth: 1

      - name: Update floating tags
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
          MAJOR_TAG: ${{ steps.meta.outputs.major_tag }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          repo="${GITHUB_REPOSITORY}"

          point_tag_at_sha() {
            local tag="$1"
            local ref_name="tags/${tag}"
            if gh api -H "Accept: application/vnd.github+json" \
              "repos/${repo}/git/ref/${ref_name}" >/dev/null 2>&1; then
              gh api --method PATCH -H "Accept: application/vnd.github+json" \
                "repos/${repo}/git/refs/${ref_name}" \
                -f sha="${sha}" -F force=true
            else
              gh api --method POST -H "Accept: application/vnd.github+json" \
                "repos/${repo}/git/refs" \
                -f ref="refs/tags/${tag}" -f sha="${sha}"
            fi
          }

          point_tag_at_sha "${MAJOR_TAG}"
          point_tag_at_sha latest

          echo "Updated ${MAJOR_TAG} and latest -> ${sha} (${TAG_NAME})"
